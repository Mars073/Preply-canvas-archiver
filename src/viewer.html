<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas Backup — archives</title>
<!-- Path relative to the extension package: no web_accessible_resources entry
     is needed, since the page belongs to that same package. -->
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  /* Figtree, the typeface of Preply's editor, bundled so an archive keeps the
     proportions of the original. SIL Open Font License; fonts/OFL.txt ships
     beside it, which the licence requires.

     Variable woff2, both slopes: 56 KB for the pair, against 712 KB for the
     TTF set Google Fonts hands out. */
  @font-face{
    font-family:"Figtree";
    src:url("fonts/Figtree-variable.woff2") format("woff2");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  /* A separate italic file, so an <em> in a lesson gets a drawn italic rather
     than an upright slanted by the browser. */
  @font-face{
    font-family:"Figtree";
    src:url("fonts/Figtree-italic-variable.woff2") format("woff2");
    font-weight:100 900;
    font-style:italic;
    font-display:swap;
  }

  /* Preply palette, extracted from their design tokens (preply-recon-1.json).
     Their exact ramp, not an approximation read off a screenshot. */
  :root{
    --bg:#f4f4f8; --panel:#fff; --line:#dcdce5; --line-soft:#ebebf1;
    --ink:#121117; --ink-2:#4d4c5c; --ink-3:#6a697c;
    --accent:#d13d76; --accent-strong:#901443;
    --accent-soft:#ffe5f0; --accent-line:#ffc2d9;
    --danger:#c9160d; --danger-line:#fdc2be; --ok:#067560;
    --radius:10px; --radius-lg:18px; --radius-btn:10px;
    --gap:12px;
    /* Two movements, two timings. --slide folds the panels away: an occasional
       gesture, a long travel, and a symmetric ease that suits both. */
    --slide:.34s; --ease:cubic-bezier(.4,0,.2,1);
    /* The swap gets its own pair. Its curve decelerates instead of easing in
       and out: over a short distance a slow start eats most of the duration
       and what remains reads as a lurch. Leaving at full speed and settling
       is what makes a short move feel deliberate rather than hurried. */
    --slide-nav:.26s; --ease-nav:cubic-bezier(0,0,.2,1);
    /* Every control in the document toolbar, whatever it holds. */
    --btn-h:35px;
    /* Two layers: a tight contact shadow at the edge of the card, and a wide,
       very pale one for detachment. A single shadow gives either a dirty halo
       or a hard edge. */
    --shadow:0 1px 2px rgba(18,17,23,.04), 0 10px 28px rgba(18,17,23,.06);
    /* Where the history panel starts: the toolbar box plus the small gap that
       sets it apart from it. Measured, not derived — CSS cannot ask the
       toolbar how tall it is. The edge fades deliberately do NOT use this:
       they need the toolbar height exactly, gap excluded, and reusing this
       number for both is what left the top fade sitting too low. */
    --history-top:52px;
    --doc-width:1089px; --doc-pad-x:52px;
  }
  *{box-sizing:border-box}
  /* An id selector (#topbar{display:flex}) beats the UA [hidden]{display:none}
     rule. Without this, anything hidden from JS stays on screen. */
  [hidden]{display:none !important}
  html,body{height:100%}
  /* The columns no longer touch: they float in a gutter, so separation comes
     from empty space rather than from rules. */
  body{
    margin:0; display:grid; grid-template-columns:264px 300px 1fr;
    padding:var(--gap); gap:var(--gap);
    background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
    /* Panels leave by sliding past the left edge; without this they would
       widen the page instead of disappearing behind it. */
    overflow:hidden;
    transition:grid-template-columns var(--slide) var(--ease),
               gap var(--slide) var(--ease);
  }
  /* Focus mode: both navigation panels give way to the document, which is the
     product. Once a page is chosen they are secondary.

     The tracks collapse to zero rather than being removed: the list stays
     three items long, which is what makes it interpolable at all — a list of
     a different length does not animate, it snaps.

     Each panel keeps its own width and is pinned to the END of its track, so
     a collapsing track drags it leftwards. The two tracks collapse across the
     same span, so on the way out the pages panel slides over the classrooms
     panel and covers it, and uncovers it on the way back. That overlap is the
     whole effect; it falls out of the geometry rather than being staged. */
  #classrooms{width:264px}
  #pages{width:300px}
  #classrooms,#pages{justify-self:end;transition:visibility 0s}
  body.focus{grid-template-columns:0px 0px 1fr;gap:0}
  /* Hidden only once the slide is over, otherwise the panel vanishes mid-
     flight. visibility, not display: it drops them from the tab order and
     from the accessibility tree, which off-screen alone would not. */
  body.focus #classrooms,body.focus #pages{
    visibility:hidden;transition:visibility 0s var(--slide);
  }

  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* Screen readers only: never display:none, which would hide it from them too. */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

  /* Skip link: navigation holds dozens of buttons before the document. Hidden
     visually when unfocused, never removed from the DOM. */
  .skip{position:absolute;left:var(--gap);top:var(--gap);z-index:100;
    transform:translateY(-200%);
    padding:10px 16px;border-radius:var(--radius-btn);
    background:var(--ink);color:#fff;text-decoration:none;font-size:13px}
  .skip:focus{transform:none}

  ul{list-style:none;margin:0;padding:0}

  /* ---------- column 1: classrooms ---------- */
  /* Card: a light rule for the outline, a shadow for the detachment. */
  .card{background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}

  #classrooms{display:flex;flex-direction:column}
  .col-head{padding:16px 16px 10px;border-bottom:1px solid var(--line-soft)}
  .col-head h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
  .head-row{display:flex;align-items:center;gap:8px}
  /* Quiet square buttons living inside a panel header rather than a toolbar.
     No frame: one there reads as a second card edge, so the hover cue moves to
     the background, which the border was carrying. The focus ring is global
     and untouched — that one is not decoration. */
  .head-btn{width:26px;height:26px;min-width:0;padding:0;border:0;
    border-radius:6px;background:transparent;color:var(--ink-2);
    align-items:center;justify-content:center;cursor:pointer}
  .head-btn:hover{background:var(--bg);color:var(--ink)}
  .head-btn .icon{width:13px;height:13px}

  /* Both appear only at the width that needs them. The back caret is pulled
     left so the glyph, not its hit area, lines up with the heading below. */
  #back-rooms{display:none;margin-left:-4px}
  .panel-fold{display:none;position:absolute;top:12px;right:12px;z-index:2}
  .col-head .sub{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
  /* A flex column rather than margins on the <li>: gap only applies between
     items, so no orphan margin is left at the end of the list. */
  .col-body{flex:1;overflow-y:auto;padding:8px;
    display:flex;flex-direction:column;gap:4px}

  .room{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px;border:0;border-radius:var(--radius);background:transparent;cursor:pointer}
  .room:hover{background:var(--bg)}
  /* aria-current is set on the current item only: "false" everywhere else is
     valid but verbose when spoken. */
  .room[aria-current]{background:var(--accent-soft)}
  .room .av{flex:0 0 auto;width:48px;height:48px;border-radius:50%;overflow:hidden;
    background:var(--accent);color:#fff;display:grid;place-items:center;
    font-size:18px;font-weight:600}
  /* A photo replaces the initial: the pink ground must not show through. */
  .room .av.has-img{background:none}
  .room .av img{width:100%;height:100%;object-fit:cover;display:block}
  .room .nm{min-width:0}
  .room .nm b{display:block;font-weight:600;font-size:13.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room .nm span{font-size:11.5px;color:var(--ink-3)}
  /* Slightly smaller than button icons: this points a direction, it is not an
     action. */
  .room .chev{margin-left:auto;display:flex;color:var(--ink-3)}
  .room .chev .icon{width:14px;height:14px}

  #usage{display:flex;align-items:center;gap:10px;
    border-top:1px solid var(--line-soft);padding:10px 16px;
    font-size:11.5px;color:var(--ink-3)}
  #usage #usage-text{min-width:0}
  #repo{margin-left:auto;display:flex;flex:0 0 auto;padding:4px;
    border-radius:8px;color:var(--ink-3)}
  #repo:hover{color:var(--ink);background:var(--bg)}
  #repo .icon{width:18px;height:18px}

  /* ---------- column 2: pages ---------- */
  #pages{display:flex;flex-direction:column}
  #filter{width:100%;margin-top:8px;padding:7px 11px;border:1px solid var(--line);
    border-radius:var(--radius-btn);background:var(--bg);font:inherit;font-size:12.5px;
    -webkit-user-select:text;user-select:text}
  .page{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;
    border:0;border-radius:var(--radius);background:transparent;cursor:pointer}
  .page:hover{background:var(--bg)}
  .page[aria-current]{background:var(--accent-soft)}
  .page .ic{flex:0 0 auto;display:flex;color:var(--ink-3);margin-top:2px}
  .page .tx{min-width:0}
  .page .tx b{display:block;font-weight:550;font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page .tx span{font-size:11.5px;color:var(--ink-3)}
  /* Search excerpt: two lines at most, the match highlighted. */
  .page .tx .hit{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;color:var(--ink-2)}
  /* Yellow, not pink: pink signals selection. A match inside a selected row
     used to vanish, and the two meanings blurred into one. */
  .page .tx .hit strong{font-weight:700;color:var(--ink);
    background:#ffe875;border-radius:3px;box-shadow:0 0 0 2px #ffe875}
  .empty-filter{margin:0;padding:10px;color:var(--ink-3);font-size:12.5px}

  /* ---------- column 3: document ---------- */
  /* The work surface overflows the bottom gutter: the document scrolls to the
     window edge while the cards on the left keep their margin. Without it,
     scrolling stops on a 12 px empty band. */
  #main{display:flex;flex-direction:column;overflow:hidden;position:relative;
    margin-bottom:calc(-1 * var(--gap))}
  /* The right column is not a card: it is the work surface the document sheet
     floats on. Avoid a card inside a card. */
  #topbar{display:flex;align-items:center;gap:8px;padding:6px}

  /* Fades marking that the document continues out of sight. They hang off
     #reading, whose box IS the reading area: no toolbar height to hardcode,
     and nothing to keep in sync when the toolbar changes. A pseudo-element of
     #scroll itself would not do — it would scroll away with the content
     instead of staying at the edge.

     Each shows only when there is something to hide, which is the point: a
     fade that is always there says nothing. pointer-events:none so they never
     intercept a click or a text selection. */
  #reading{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  #reading::before,#reading::after{content:"";position:absolute;left:0;right:0;
    height:30px;pointer-events:none;opacity:0;z-index:2;
    transition:opacity var(--slide-nav) var(--ease-nav)}
  #reading::before{top:0;background:linear-gradient(var(--bg),rgba(244,244,248,0))}
  #reading::after{bottom:0;background:linear-gradient(rgba(244,244,248,0),var(--bg))}
  #reading.fade-top::before,#reading.fade-bottom::after{opacity:1}
  #topbar h1{margin:0;font-size:20px;font-weight:650;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
  /* Icons inherit currentColor, so they follow the button through its states
     (hover, danger, active) with no file variant. */
  .icon{width:16px;height:16px;flex:0 0 auto}
  /* One height for every toolbar control, declared rather than left to the
     content. A button holding text is as tall as its line box, ~19.4px here,
     while one holding only a 16px icon is not — three and a half pixels apart,
     which shows most inside the zoom group where the two kinds adjoin. */
  .act{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:var(--btn-h);padding:0 13px;
    border:1px solid var(--line);border-radius:var(--radius-btn);
    background:var(--panel);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .act:hover{border-color:var(--ink-3)}
  /* Dark pink text: #d13d76 on #ffe5f0 is only 3.8:1, below the AA threshold. */
  .act[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-strong);
    background:var(--accent-soft)}
  .act.danger{color:var(--danger);border-color:var(--danger-line)}
  .act.danger:hover{border-color:var(--danger)}

  /* Zoom group: three adjoining buttons, borders merged. */
  #zoom{display:flex}
  #zoom .act{border-radius:0;margin-left:-1px}
  #zoom .act:first-child{border-radius:var(--radius-btn) 0 0 var(--radius-btn);margin-left:0}
  #zoom .act:last-child{border-radius:0 var(--radius-btn) var(--radius-btn) 0}
  #zoom .act:focus-visible{position:relative;z-index:1}
  /* Square-ish, and the height now comes from .act. */
  .iconly{width:var(--btn-h);min-width:0;padding:0}
  .zval{min-width:62px;padding:0;
    font-variant-numeric:tabular-nums;color:var(--ink-2)}

  /* Secondary actions menu. Delete is no longer permanently exposed: a
     destructive action does not deserve the same rank as printing. */
  #more-wrap{position:relative}
  #more-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:5;
    min-width:200px;padding:6px;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(18,17,23,.04), 0 12px 32px rgba(18,17,23,.12)}
  .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:8px 10px;border:0;border-radius:8px;background:transparent;
    font-size:12.5px;cursor:pointer;white-space:nowrap}
  .mi:hover{background:var(--bg)}
  .mi.danger{color:var(--danger)}
  .mi.danger:hover{background:#ffeceb}

  /* Document header: in the sheet's column, not in the toolbar. The title
     lines up with the first letter of the text. */
  #sheet{max-width:calc(var(--doc-width) + var(--doc-pad-x) * 2);margin:0 auto}
  #dochead{padding:4px var(--doc-pad-x) 14px}
  #dochead h1{margin:0 0 3px;padding:2px 7px;margin-left:-7px;
    font-size:24px;font-weight:650;letter-spacing:-.01em;
    border-radius:8px;cursor:default}
  /* Affordance: nothing says a title is editable until it is hovered. This
     ground is the only hint before the double-click. */
  #dochead h1:hover{background:var(--line-soft)}
  #dochead h1[contenteditable="true"]{background:var(--panel);cursor:text;
    box-shadow:inset 0 0 0 2px var(--accent);
    -webkit-user-select:text;user-select:text}
  #meta{margin:0;font-size:12.5px;color:var(--ink-3)}

  /* Overflow on both axes: past 100% the document exceeds the pane width and
     must stay reachable by horizontal scrolling. */
  /* Side padding must exceed the blur radius of the document shadow, or
     overflow:auto slices it flat along the edges. */
  /* overflow-y is scroll, not auto: the gutter is reserved once and for all.
     The document is centred, so a scrollbar that comes and goes moves it
     sideways — and it does come and go, because re-rendering empties the
     article for an instant and the diff then adds the deleted lines back.
     Reading was drifting left and snapping back on every history toggle.
     Browsers with overlay scrollbars reserve nothing here, which is right:
     they never caused the shift. */
  #scroll{flex:1;overflow-y:scroll;overflow-x:auto;padding:0 16px 48px}
  /* Typography of Preply's editor: Figtree, 20px, ligatures off. Without this
     baseline an archived <span style="font-size:20px"> looks 1.43x larger than
     its surroundings, where in Preply it blends in. */
  /* --doc-width is the width of Preply's text column. max-width targets the
     border box (box-sizing:border-box), hence adding the padding: without it
     the column would be 1089 - 104 px and lines would break elsewhere. */
  #doc{padding:44px var(--doc-pad-x);background:var(--panel);
    border:1px solid var(--line-soft);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    -webkit-user-select:text;user-select:text;
    font-family:"Figtree","Noto Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:20px;line-height:1.4;font-weight:400;
    font-feature-settings:"liga" 0;font-variant-ligatures:none}
  /* Everything below is measured against a live Canvas, not chosen: the values
     that were here before were invented, and every one of them was wrong.
     Preply spaces its blocks with line-height alone and gives them no margin,
     indents the list item rather than the list, and pads its cells twice as
     generously as was guessed here.

     `break-spaces` is the editor's own: a run of spaces is kept as typed, which
     in a language lesson is sometimes the point. */
  #doc{white-space:break-spaces}
  #doc p{margin:0;min-height:1.55em}
  /* The stylesheet resets `ul` for the interface, and that reset reached into
     the archived document as well — every bullet in every lesson was gone. */
  #doc ul{list-style:disc}
  #doc ol{list-style:decimal}
  #doc ul,#doc ol{margin:0;padding-left:0}
  #doc li{margin-left:16px}
  #doc li p{margin:0}
  #doc img{max-width:100%;height:auto}
  /* A picture whose bytes are gone leaves a visible gap rather than nothing:
     silence would read as an empty paragraph. */
  #doc img[data-pca-missing],#doc img[data-pca-unreachable]{
    display:inline-block;min-width:120px;min-height:60px;
    border:1px dashed var(--danger-line);border-radius:6px;
    background:#ffeceb}
  /* Their tables span the column. Left to itself a table shrinks to its
     content, and an archived lesson showed one two thirds the width it had. */
  #doc table{border-collapse:collapse;margin:0;width:100%}
  #doc td,#doc th{border:1px solid var(--line);padding:8px 16px;
    background:var(--panel)}
  /* Header cells: tinted, and read left where a browser centres them. Neither
     survives a capture — both come from Preply's stylesheet, and the clone only
     rescues what an element carries inline.

     The cell keeps the weight the browser gives it; it is the paragraph inside
     that Preply sets back to regular. Reading the two as one measurement is
     what made a first pass strip the bold from both. */
  #doc th{background:var(--bg);text-align:left}
  #doc th p{font-weight:400}
  #doc hr{border:1px solid var(--line);margin:8px 0}

  /* Comparison against the previous version.
     The box-shadow has neither blur nor spread, so it is not a border: it is
     the same flat colour offset 14 px to the left, extending the ground into
     the sheet's inner margin. Padding on the block would shift the text and
     break alignment with the unchanged lines.
     Deletions keep a non-colour cue, the strike-through; additions rest on
     colour alone — an accepted deviation from WCAG 1.4.1. */
  #doc .pca-add{background:#e0faf6;box-shadow:-14px 0 0 #e0faf6;border-radius:2px}

  /* The searched term, flashed once when a filtered page is opened. It holds
     long enough to be found by eye, then fades out and the span is unwrapped.
     Yellow is deliberately outside the diff palette: green and red already
     mean added and removed, and a third meaning must not borrow their colours.

     A spread-only box-shadow in the same colour pushes the ground a few pixels
     past the glyphs, so the mark reads as a highlighter stroke rather than as
     a tight box clamped to the text. It has no offset and no blur: it is not a
     shadow here, it is extra background. It fades in the same keyframes as the
     background, or the halo would outlive the fill.

     Both go to transparent YELLOW rather than to `transparent`, which
     interpolates through grey and dirties the last frames.

     Left out of the reduced-motion rule on purpose: nothing moves, and the
     mark disappearing on its own is the behaviour, not an ornament. */
  @keyframes pca-hit-fade{
    0%,55%{background-color:#fde68a;box-shadow:0 0 0 3px #fde68a}
    100%{background-color:rgba(253,230,138,0);box-shadow:0 0 0 3px rgba(253,230,138,0)}
  }
  #doc .pca-hit{border-radius:3px;
    animation:pca-hit-fade 1.7s var(--ease) forwards}
  #doc .pca-del{background:#ffeceb;box-shadow:-14px 0 0 #ffeceb;border-radius:2px;
    color:var(--ink-2);text-decoration:line-through;text-decoration-color:#f87e77}

  #placeholder{display:grid;place-items:center;height:100%;color:var(--ink-3);
    font-size:13px;text-align:center;padding:40px}

  /* ---------- history panel ---------- */
  /* Floating panel, detached from the edges: it rests on the work surface
     instead of being glued to the window border. */
  /* bottom = two gutters: #main now overflows 12 px below the body, so a
     bottom of 12 px would stick the panel to the window edge. */
  #history{position:absolute;z-index:3;top:var(--history-top);right:6px;bottom:calc(var(--gap) * 2);width:340px;
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--radius-lg);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 1px 2px rgba(18,17,23,.04), 0 16px 40px rgba(18,17,23,.10)}
  /* Closed state. The panel keeps its box and slides out to the right,
     overlapping the document on the way — it is an overlay already, so the
     movement only has to reveal that. The `hidden` attribute is deliberately
     not used: [hidden] forces display:none, which cancels any transition.
     visibility does what hidden did for assistive technology, and is delayed
     by the slide so the panel does not blink out mid-flight. */
  #history{visibility:hidden;opacity:0;
    transform:translateX(calc(100% + 6px));
    transition:transform var(--slide) var(--ease),
               opacity var(--slide) var(--ease),
               visibility 0s var(--slide)}
  #history.open{visibility:visible;opacity:1;transform:none;
    transition:transform var(--slide) var(--ease),
               opacity var(--slide) var(--ease),
               visibility 0s}
  #history header{padding:16px 18px 12px;border-bottom:1px solid var(--line-soft)}
  #history header .row{display:flex;align-items:center;gap:2px}
  #history h2{margin:0;font-size:14px;font-weight:650}
  #history p{margin:6px 0 0;font-size:11.5px;color:var(--ink-3)}
  /* The wrapper takes the auto margin, not the cross: it now comes first, and
     leaving it on the cross would strand the ellipsis against the heading. */
  #hmore-wrap{position:relative;margin-left:auto}
  #hmore,#hclose{border:0;background:transparent;cursor:pointer;display:flex;
    align-items:center;justify-content:center;border-radius:6px;
    color:var(--ink-3);padding:4px}
  #hmore:hover,#hclose:hover{background:var(--bg);color:var(--ink)}
  #hmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:6;
    min-width:230px;padding:6px;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(18,17,23,.04), 0 12px 32px rgba(18,17,23,.12)}
  /* Nothing to sweep is a state, not a failure: the entry stays visible and
     says zero rather than vanishing and moving the other one under the
     pointer. */
  #hmenu .mi[disabled]{opacity:.45;cursor:default;color:var(--ink-3)}
  #hmenu .mi[disabled]:hover{background:transparent}
  #hlist{flex:1;overflow-y:auto;padding:10px}
  /* Two distinct actions per version: open and delete. They are therefore two
     sibling buttons inside an <li>, not a button nested in a role="button"
     container — invalid nesting, and uninterpretable for assistive
     technology. */
  .ver{position:relative;margin-bottom:6px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel)}
  .ver:hover{border-color:var(--ink-3)}
  .ver.current{border-color:var(--accent);background:var(--accent-soft)}
  .ver-open{display:block;width:100%;text-align:left;padding:10px 34px 10px 12px;
    border:0;background:transparent;cursor:pointer}
  .ver b{display:block;font-size:12.5px;font-weight:600}
  /* What this version changed, not how it opens. Two lines at most: the point
     is to recognise the change, not to read it here. */
  .ver .ex{margin-top:5px;font-size:11.5px;color:var(--ink-2);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* The sign carries the meaning for the eye, the colour only reinforces it —
     WCAG 1.4.1, which the marks inside the document itself still fail. */
  .ver .ex .sign{font-weight:700;margin-right:4px}
  .ver .ex.added{color:var(--ok)}
  .ver .ex.removed{color:var(--danger)}
  /* Ellipsis pinned to the corner. The row is the positioning context, and it
     has to sit above .ver-open, which spans the whole row underneath it. */
  .ver-more{position:absolute;top:6px;right:6px;z-index:1;
    width:24px;height:24px;padding:0;display:flex;align-items:center;
    justify-content:center;border:0;border-radius:6px;background:transparent;
    color:var(--ink-3);cursor:pointer}
  .ver-more .icon{width:14px;height:14px}
  .ver-more:hover{background:var(--bg);color:var(--ink)}
  /* Flipped above the button when the row sits near the bottom of a scrolling
     list, which would otherwise clip the menu of the oldest version out of
     reach — and the oldest is the one most likely to be deleted. */
  .ver-menu.up{top:auto;bottom:30px}

  /* Anchored to the window, not to a panel: an unhandled error can come from
     anywhere, including a render that left the layout half built. */
  #crash{position:fixed;left:var(--gap);right:var(--gap);bottom:var(--gap);
    z-index:20;display:flex;align-items:flex-start;gap:12px;
    padding:12px 14px;background:var(--panel);color:var(--ink);
    border:1px solid var(--danger-line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(18,17,23,.06), 0 16px 40px rgba(18,17,23,.16)}
  .crash-body{flex:1;min-width:0}
  #crash strong{display:block;font-size:12.5px;color:var(--danger)}
  #crash p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2);
    overflow-wrap:anywhere}
  #crash .crash-note{color:var(--ink-3)}
  #crash-close{flex:0 0 auto;border:0;background:transparent;cursor:pointer;
    display:flex;padding:4px;border-radius:6px;color:var(--ink-3)}
  #crash-close:hover{background:var(--bg);color:var(--ink)}
  @media print{#crash{display:none}}
  .ver-menu{position:absolute;top:30px;right:6px;z-index:5;min-width:180px;
    padding:6px;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(18,17,23,.04), 0 12px 32px rgba(18,17,23,.12)}

  @media print{
    body{display:block;background:#fff;padding:0}
    /* The document header stays printed: page name, tutor and date are exactly
       what one wants to find again on a PDF filed in a folder. */
    #classrooms,#pages,#topbar,#history{display:none}
    #main,#reading,#scroll,#sheet{overflow:visible;padding:0;margin:0;max-width:none}
    #reading::before,#reading::after{display:none}
    #dochead{padding:0 0 10px}
    #dochead h1{font-size:18px;padding:0;margin-left:0;background:none;box-shadow:none}
    /* The PDF stays canonical: no zoom, no comparison marks. A deleted line no
       longer belongs to the document — printing it would misstate its
       contents. */
    #doc .pca-del{display:none}
    /* A transient mark must never be frozen into a PDF. */
    #doc .pca-hit{animation:none;background:none}
    #doc .pca-add{background:none;box-shadow:none}

    #doc{max-width:none;margin:0;padding:0;border:0;border-radius:0;zoom:1 !important}
    @page{margin:16mm}
  }

  /* Below this width the two panels no longer fit beside the document without
     squeezing it. They share one column: the pages panel covers the classrooms
     panel, and the caret in its header goes back. It enters from the right, as
     it sits to the right in the wide layout — the spatial order survives the
     breakpoint, so the movement reads as going one level deeper.

     Two tracks on both sides of the focus toggle, so it stays interpolable
     here as well: a list of a different length would snap. */
  @media (max-width:1439px){
    body{grid-template-columns:300px 1fr}
    body.focus{grid-template-columns:0px 1fr}

    /* All three placed explicitly. The two panels must land in the SAME cell:
       with only grid-column set, auto-placement pushed the pages panel to a
       second row and dragged the document down with it. */
    #classrooms,#pages{grid-column:1;grid-row:1;width:300px}
    /* Grid items take z-index with no positioning. Without it the panels are
       painted before #main, which comes later in the DOM, and a panel would
       slide in UNDERNEATH the document. */
    #main{grid-column:2;grid-row:1;z-index:0}
    #classrooms{z-index:1}
    #pages{z-index:2}
    #back-rooms{display:inline-flex}

    /* One corridor, off to the left. Whichever panel is not current waits out
       there; the current one sits in place. Switching sends one out and brings
       the other in along that same path, so they cross rather than replace one
       another — the swap is visible, which is what says a level was changed.

       visibility is kept alongside the fade: an opacity:0 panel is still
       focusable and still in the accessibility tree. It is delayed by the slide
       so the leaving panel is not cut off mid-flight. */
    #classrooms,#pages{
      transform:translateX(calc(-100% - var(--gap)));opacity:0;visibility:hidden;
      transition:transform var(--slide-nav) var(--ease-nav),
                 opacity var(--slide-nav) var(--ease-nav),
                 visibility 0s var(--slide-nav)}
    body:not(.drill) #classrooms,body.drill #pages{
      transform:none;opacity:1;visibility:visible;
      transition:transform var(--slide-nav) var(--ease-nav),
                 opacity var(--slide-nav) var(--ease-nav),
                 visibility 0s}

    /* Focus mode outranks the drill state, and has to say so explicitly: the
       selectors above score the same, so source order alone was leaving the
       current panel visible. It kept a sliver showing, because the collapsed
       track stops at the body padding and overflow:hidden clips at the padding
       box rather than inside it. */
    body.focus #classrooms,body.focus #pages,body.focus.drill #pages{
      visibility:hidden;transition:visibility 0s var(--slide)}
  }

  /* Narrower still: the panel stops taking a column and floats over the
     document. Squeezing the reading column is the one thing that cannot be
     absorbed — an archived page carries a fixed 1089px text column, so a
     narrower pane does not reflow it, it makes it scroll sideways. Over the
     top, the sheet keeps the geometry Preply gave it.

     The fold has to change with it. Above this width it collapses a grid
     track, which drags the panel out by geometry; with a single column there
     is no track to collapse, so it travels on its own transform — the same
     corridor the classrooms/pages swap already uses. */
  @media (max-width:839px){
    body,body.focus{grid-template-columns:1fr}
    #classrooms,#pages,#main{grid-column:1;grid-row:1}
    /* Pinned to the left edge, where the collapsing track used to hold it.
       The shadow is the history panel's: both are now sheets over the work. */
    #classrooms,#pages{justify-self:start;position:relative;
      box-shadow:0 1px 2px rgba(18,17,23,.04), 0 16px 40px rgba(18,17,23,.10)}
    /* The transition has to be restated: the fold rule above replaces the
       shorthand with visibility alone, so a transform declared here and
       nowhere else would snap. The .drill variant is listed for the same
       reason — it outscores the plain one and would win otherwise. */
    body.focus #classrooms,body.focus #pages,body.focus.drill #pages{
      transform:translateX(calc(-100% - var(--gap)));
      transition:transform var(--slide) var(--ease),visibility 0s var(--slide)}

    /* The panel now hides the toolbar caret, so it carries its own — absolutely
       placed, hence the relative panel above. */
    .panel-fold{display:flex}
  }

  /* Narrow enough that the toolbar would wrap or push the zoom group off the
     edge. The labels go, the icons stay, and the buttons square up like the
     icon-only ones beside them.

     Taken out of sight rather than out of the document: display:none would
     drop the text from the accessible name too, leaving two buttons announced
     as "button". The geometry is .sr-only's, which the interface already
     uses for exactly this. */
  @media (max-width:539px){
    .act .lbl{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    #btn-history,#btn-print{width:var(--btn-h);padding:0}
  }

  /* Until the stored preferences have been applied, nothing moves: a panel
     must not be seen sliding away on a page that opened folded. The class is
     dropped one frame after boot. */
  body.booting,body.booting #classrooms,body.booting #pages,
  body.booting #history{transition:none}

  /* Motion is decoration here: the layout is identical at both ends, so
     removing the animation costs nothing and every toggle stays instant.
     Covers the history panel too, which slides on the same variables. */
  @media (prefers-reduced-motion:reduce){
    body,body #classrooms,body #pages,#history,#history.open,
    body.drill #classrooms,body.drill #pages,body:not(.drill) #classrooms,
    body.focus #classrooms,body.focus #pages,body.focus.drill #pages,
    #reading::before,#reading::after{transition:none}
  }
</style>
</head>
<body class="booting">

<!-- Every user-visible string carries its key and is filled by applyI18n().
     Nothing is written twice: the markup declares, messages.json holds. -->
<a class="skip" href="#doc" data-i18n="skipToContent"></a>

<nav id="classrooms" class="card" aria-labelledby="rooms-head">
  <!-- Only below the drawer breakpoint, where the panel floats over #main and
       covers the toolbar caret that would otherwise fold it. Without this the
       panel could be opened and never closed. -->
  <button class="panel-fold head-btn" type="button" data-icon="caret-left"
          data-i18n-label="focusHide" data-i18n-title="focusHide"></button>
  <div class="col-head">
    <h2 id="rooms-head" tabindex="-1" data-i18n="classroomsTitle"></h2>
    <p class="sub" data-i18n="classroomsSubtitle"></p>
  </div>
  <ul class="col-body" id="room-list"></ul>
  <div id="usage">
    <span id="usage-text">&mdash;</span>
    <!-- Icon-only link: without an accessible name it is announced as "link"
         and nothing else. The new-tab mention belongs to the label, because a
         context switch has to be known before activation, not after. -->
    <a id="repo" href="https://github.com/Mars073/Preply-canvas-archiver"
       target="_blank" rel="noopener noreferrer" data-icon="github-logo"
       data-i18n-title="repoTitle" data-i18n-label="repoLabel"></a>
  </div>
</nav>

<nav id="pages" class="card" aria-labelledby="pages-head">
  <button class="panel-fold head-btn" type="button" data-icon="caret-left"
          data-i18n-label="focusHide" data-i18n-title="focusHide"></button>
  <div class="col-head">
    <div class="head-row">
      <!-- Shown only below the two-panel breakpoint, where this panel covers
           the classrooms one instead of sitting beside it. Hidden above it:
           there is nothing to go back to when both are on screen. -->
      <button class="head-btn" id="back-rooms" type="button"
              data-icon="caret-left"
              data-i18n-label="backToRooms" data-i18n-title="backToRooms"></button>
      <h2 id="pages-head" data-i18n="pagesTitle"></h2>
    </div>
    <input id="filter" type="search"
           data-i18n-placeholder="filterPlaceholder" data-i18n-label="filterLabel">
  </div>
  <ul class="col-body" id="page-list"></ul>
</nav>

<main id="main">
  <div id="topbar" hidden>
    <button class="act iconly" id="btn-focus" type="button" aria-pressed="false"></button>
    <div id="actions">
      <div id="zoom" role="group" data-i18n-label="zoomGroup">
        <button class="act iconly" id="zoom-out" type="button" data-i18n-label="zoomOut">&minus;</button>
        <button class="act zval" id="zoom-reset" type="button"
                data-i18n-title="zoomReset">100%</button>
        <button class="act iconly" id="zoom-in" type="button" data-i18n-label="zoomIn">+</button>
      </div>
      <!-- The label lives in its own span so a narrow window can take it out of
           sight without taking it out of the accessible name — and because
           applyI18n writes textContent, which on the button itself would wipe
           the icon painted into it. -->
      <button class="act" id="btn-history" data-icon="clock-counter-clockwise"
              aria-pressed="false"><span class="lbl" data-i18n="historyBtn"></span></button>
      <button class="act" id="btn-print" data-icon="printer">
        <span class="lbl" data-i18n="printBtn"></span></button>
      <!-- A link, not a button: it leads somewhere, so ctrl-click, middle-click
           and "open in new tab" have to work. Hidden until a snapshot with a
           usable address is on screen. The new-tab mention belongs to the
           label: a context switch has to be known before activation. -->
      <a class="act iconly" id="btn-preply" data-icon="arrow-square-out"
         target="_blank" rel="noopener noreferrer"
         data-i18n-label="openOnPreply" data-i18n-title="openOnPreplyTitle" hidden></a>
      <!-- No role="menu", and no aria-haspopup either, whose "true" means
           "menu": both promise arrow-key navigation, Home, End and roving
           focus. Without the machinery they lie to the screen reader. A plain
           group of buttons revealed by aria-expanded is walked with Tab, which
           is what a user expects here anyway.

           role="group" rather than no role at all: a bare div maps to generic,
           which ARIA forbids naming, so the aria-label on it was discarded.
           group carries the name and promises no keyboard behaviour. -->
      <div id="more-wrap">
        <button class="act iconly" id="btn-more" type="button" data-icon="dots-three"
                data-i18n-label="moreActions" aria-expanded="false"></button>
        <div id="more-menu" role="group" data-i18n-label="moreMenuLabel" hidden>
          <button class="mi" id="btn-export" type="button" data-icon="file-html"
                  data-i18n="exportBtn"></button>
          <button class="mi danger" id="btn-delete" type="button" data-icon="trash"
                  data-i18n="deletePageBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pages change without a reload: with no live region nothing is announced
       and the user never learns the document swapped under them. -->
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Wraps the scroller so the edge fades have something to hang off whose
       top IS the top of the reading area. Anchored to #main they needed the
       toolbar height as a number, which is guesswork and was wrong. -->
  <div id="reading">
    <div id="scroll">
      <div id="placeholder" data-i18n="placeholderSelect"></div>
      <div id="sheet" hidden>
        <header id="dochead">
          <h1 id="doc-title" tabindex="0" aria-describedby="title-hint"></h1>
          <span id="title-hint" class="sr-only" data-i18n="renameHint"></span>
          <p id="meta"></p>
        </header>
        <!-- tabindex=-1: target of the skip link, focusable by script but absent
             from the tab order. `lang` is set on display from the lesson's own
             language: without it a screen reader speaks Polish with French rules. -->
        <article id="doc" tabindex="-1" aria-labelledby="doc-title"></article>
      </div>
    </div>
  </div>


  <aside id="history" aria-labelledby="history-head">
    <header>
      <div class="row">
        <h2 id="history-head" tabindex="-1" data-i18n="historyTitle"></h2>
        <!-- Bulk actions on the whole list, kept out of the rows: they act on
             every version, not on the one they would sit next to. -->
        <div id="hmore-wrap">
          <button id="hmore" type="button" data-icon="dots-three"
                  data-i18n-label="historyActions" aria-expanded="false"></button>
          <div id="hmenu" role="group" data-i18n-label="historyActions" hidden>
            <button class="mi danger" id="btn-drop-same" type="button"
                    data-icon="trash"></button>
            <button class="mi danger" id="btn-drop-old" type="button"
                    data-icon="trash"></button>
          </div>
        </div>
        <button id="hclose" data-icon="x" data-i18n-label="historyClose"></button>
      </div>
      <p data-i18n="historyHint"></p>
    </header>
    <ul id="hlist"></ul>
  </aside>
</main>

<!-- Shown only when something failed with nobody to catch it. role="alert"
     rather than the polite live region above: this one interrupts, because
     the action the reader asked for did not happen. -->
<div id="crash" role="alert" hidden>
  <div class="crash-body">
    <strong data-i18n="crashTitle"></strong>
    <p id="crash-what"></p>
    <p class="crash-note" data-i18n="crashPrivacy"></p>
  </div>
  <a id="crash-report" class="act" target="_blank" rel="noopener noreferrer"
     data-i18n="crashReport"></a>
  <button id="crash-close" type="button" data-icon="x"
          data-i18n-label="crashDismiss"></button>
</div>

<!-- i18n.js first: viewer.js calls t() while wiring its handlers. -->
<!-- crash.js before the rest: its handlers cannot guard code that has already
     run, and a build that fails on load fails while viewer.js is being wired. -->
<script src="crash.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="viewer.js"></script>
</body>
</html>
